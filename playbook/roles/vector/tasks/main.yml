---
- name: Install required packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gnupg
    state: present
    update_cache: true

- name: Download Vector repository GPG key
  ansible.builtin.get_url:
    url: "{{ vector_apt_key_url }}"
    dest: "/tmp/vector.asc"
    mode: "0644"

- name: Convert Vector repository key to GPG format
  ansible.builtin.command:
    cmd: "gpg --dearmor --yes --output {{ vector_apt_keyring }} /tmp/vector.asc"
    creates: "{{ vector_apt_keyring }}"

- name: Configure Vector APT repository
  ansible.builtin.apt_repository:
    repo: "{{ vector_apt_repository }}"
    filename: vector
    state: present
    update_cache: true

- name: Install Vector
  ansible.builtin.apt:
    name: "{{ vector_package_name }}"
    state: present

- name: Ensure Vector configuration directory exists
  ansible.builtin.file:
    path: "{{ vector_config_dir }}"
    state: directory
    owner: root
    group: vector
    mode: "0755"

- name: Deploy Vector configuration
  ansible.builtin.template:
    src: vector.yml.j2
    dest: "{{ vector_config_file }}"
    owner: root
    group: vector
    mode: "0640"
    validate: "/usr/bin/vector validate --config-yaml %s"
  notify: Restart Vector

- name: Ensure Vector service is enabled and started
  ansible.builtin.systemd:
    name: "{{ vector_service_name }}"
    enabled: true
    state: started
